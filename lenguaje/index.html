<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enciclopedia Interactiva de Ortografía y Gramática Española</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .atlas-back{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;margin-bottom:14px;padding:8px 14px 8px 12px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(255,255,255,.06);color:#e2e8f0;font-size:13px;font-weight:700;text-decoration:none}
    .atlas-back:hover{background:rgba(255,255,255,.14);color:#fff}
    .atlas-back:focus-visible{outline:2px solid #fff;outline-offset:2px}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="atlas-back" href="../index.html"><span aria-hidden="true">←</span> Explora</a>
      <div class="brand">
        <strong>Enciclopedia Española</strong>
        <span>Ortografía · Gramática · Redacción</span>
      </div>
      <input id="search" class="search" placeholder="Buscar regla, tema o categoría...">
      <nav id="nav"></nav>
    </aside>

    <main class="main">
      <section class="hero">
        <div class="topbar">
          <div>
            <h1 id="heroTitle">Enciclopedia Interactiva</h1>
            <p id="heroDescription">Reglas, ejemplos y práctica.</p>
          </div>
        </div>
        <div class="toolbar">
          <button id="homeBtn" class="btn">Inicio</button>
          <button id="practiceBtn" class="btn primary">Practicar</button>
        </div>
      </section>

      <section class="content-grid">
        <article id="content" class="card article">
          <div id="article">Cargando...</div>
        </article>

        <aside class="card practice-panel">
          <h2>Progreso</h2>
          <p class="small">Usa el buscador para encontrar reglas y luego practica en la sección interactiva.</p>
          <div class="progress"><div id="progressBar"></div></div>
          <p id="score" class="small">Puntaje: 0/0</p>
        </aside>
      </section>

      <section id="practice" class="card hidden">
        <p id="exerciseCounter" class="small"></p>
        <div id="exerciseBox" class="exercise"></div>
        <div id="feedback" class="feedback"></div>
        <div class="toolbar">
          <button id="nextExercise" class="btn primary" disabled>Siguiente ejercicio</button>
          <button id="resetPractice" class="btn">Reiniciar práctica</button>
        </div>
      </section>
    </main>
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
