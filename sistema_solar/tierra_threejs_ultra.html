<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tierra — Three.js</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">

<style>
  :root {
    color-scheme: dark;
    --panel: rgba(5, 12, 22, .62);
    --line: rgba(255,255,255,.12);
    --text: #eef6ff;
    --muted: #9bb0c6;
    --accent: #66c8ff;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 40%, #08111f 0%, #02050a 45%, #000 100%);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: #000;
    transition: opacity .7s ease;
  }

  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loader {
    text-align: center;
    color: white;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-size: 11px;
  }

  .loader-ring {
    width: 42px;
    height: 42px;
    margin: 0 auto 18px;
    border: 1px solid rgba(255,255,255,.15);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #hud {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  .panel {
    pointer-events: auto;
    position: absolute;
    top: 18px;
    left: 18px;
    width: min(330px, calc(100vw - 36px));
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(130%);
    -webkit-backdrop-filter: blur(18px) saturate(130%);
    box-shadow: 0 16px 50px rgba(0,0,0,.35);
  }

  .panel h1 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 650;
  }

  .panel p {
    margin: 0 0 14px;
    font-size: 12px;
    line-height: 1.45;
    color: var(--muted);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    align-items: center;
    margin: 10px 0;
  }

  .row label {
    font-size: 12px;
    color: var(--text);
  }

  .row output {
    min-width: 46px;
    text-align: right;
    font-size: 11px;
    color: var(--muted);
  }

  input[type="range"] {
    width: 100%;
    grid-column: 1 / -1;
    accent-color: var(--accent);
  }

  .checks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  .check {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 9px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 9px;
    background: rgba(255,255,255,.025);
    font-size: 11px;
  }

  .buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 12px;
  }

  button {
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px;
    background: rgba(255,255,255,.055);
    color: white;
    padding: 8px 9px;
    cursor: pointer;
    font: inherit;
    font-size: 11px;
  }

  button:hover {
    background: rgba(255,255,255,.1);
  }

  .badge {
    position: absolute;
    right: 18px;
    top: 18px;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(2,8,15,.55);
    backdrop-filter: blur(12px);
    color: #c9d8e7;
    font-size: 11px;
  }

  .help {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    white-space: nowrap;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(2,8,15,.5);
    backdrop-filter: blur(10px);
    font-size: 10px;
    color: #9eb1c4;
  }

  @media (max-width: 700px) {
    .panel {
      top: 10px;
      left: 10px;
      width: min(290px, calc(100vw - 20px));
      padding: 12px;
    }
    .badge { display: none; }
    .help { bottom: 10px; font-size: 9px; }
  }
  /* Migas que inyecta nav.js. Esta página no carga styles.css —tiene su propia
     hoja— así que el formato va aquí, a juego con el resto del sitio. */
  .crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 10px;font-size:12px;font-weight:700}
  .crumbs a{color:#7dd3fc;text-decoration:none;padding:9px 6px;margin:-7px 0;border-radius:6px}
  .crumbs a:hover{color:#fff;background:rgba(56,189,248,.16)}
  .crumbs a:focus-visible{outline:2px solid #38bdf8;outline-offset:1px}
  .crumbs span[aria-current]{color:#e2e8f0}
  .crumbs i{color:#64748b;font-style:normal}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.185.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.185.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="loading">
  <div class="loader">
    <div class="loader-ring"></div>
    Construyendo la Tierra
  </div>
</div>

<div id="hud">
  <section class="panel">
    <h1>Tierra · Three.js</h1>
    <p>Render multicapa con superficie, relieve, océanos especulares, noche, nubes, atmósfera y estrellas.</p>

    <div class="row">
      <label for="rotation">Velocidad de rotación</label>
      <output id="rotationValue">1.0×</output>
      <input id="rotation" type="range" min="0" max="4" step="0.05" value="1">
    </div>

    <div class="row">
      <label for="sun">Ángulo del Sol</label>
      <output id="sunValue">0°</output>
      <input id="sun" type="range" min="-180" max="180" step="1" value="-25">
    </div>

    <div class="row">
      <label for="cloudOpacity">Densidad de nubes</label>
      <output id="cloudValue">82%</output>
      <input id="cloudOpacity" type="range" min="0" max="1" step="0.01" value="0.82">
    </div>

    <div class="checks">
      <label class="check"><input id="autoRotate" type="checkbox" checked> Rotación</label>
      <label class="check"><input id="showClouds" type="checkbox" checked> Nubes</label>
      <label class="check"><input id="showAtmosphere" type="checkbox" checked> Atmósfera</label>
      <label class="check"><input id="showStars" type="checkbox" checked> Estrellas</label>
    </div>

    <div class="buttons">
      <button id="viewAmericas">América</button>
      <button id="viewEurope">Europa</button>
      <button id="viewAsia">Asia</button>
    </div>
  </section>

  <div class="badge">WebGL · Three.js r185</div>
  <div class="help">Arrastra para rotar · rueda/pellizco para zoom · doble clic para restablecer</div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const TEXTURES = {
  // Los mapas viven en textures/earth/ y los comparte con el resto del sitio.
  // Antes iban incrustados aqui en base64 y este archivo pesaba 8,2 MB: el
  // navegador no podia cachearlos, los reparseaba como texto en cada carga y
  // ninguna otra pagina podia reutilizarlos.
  day:      'textures/earth/day.jpg',
  clouds:   'textures/earth/clouds.jpg',
  lights:   'textures/earth/lights.jpg',
  normal:   'textures/earth/normal.jpg',
  specular: 'textures/earth/specular.jpg'
};

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
  38,
  innerWidth / innerHeight,
  0.01,
  1000
);
camera.position.set(0, 0.15, 3.28);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.enablePan = false;
controls.minDistance = 1.35;
controls.maxDistance = 8;
controls.rotateSpeed = 0.45;
controls.zoomSpeed = 0.7;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.28,
  0.55,
  0.88
);
composer.addPass(bloom);

const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();
const loader = new THREE.TextureLoader();

function loadTexture(url, color = false) {
  const t = loader.load(url);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(16, maxAnisotropy);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  return t;
}

const dayTexture = loadTexture(TEXTURES.day, true);
const cloudTexture = loadTexture(TEXTURES.clouds, true);
const lightsTexture = loadTexture(TEXTURES.lights, true);
const normalTexture = loadTexture(TEXTURES.normal, false);
const specularTexture = loadTexture(TEXTURES.specular, false);

const earthRoot = new THREE.Group();
earthRoot.rotation.z = THREE.MathUtils.degToRad(-23.44);
scene.add(earthRoot);

const planetSpin = new THREE.Group();
earthRoot.add(planetSpin);

const sphereGeo = new THREE.SphereGeometry(1, 192, 192);

/* Superficie principal.
   Phong se utiliza aquí porque la textura especular clásica del dataset
   representa océanos con gran precisión. */
const earthMaterial = new THREE.MeshPhongMaterial({
  map: dayTexture,
  normalMap: normalTexture,
  normalScale: new THREE.Vector2(0.62, 0.62),
  specularMap: specularTexture,
  specular: new THREE.Color(0x7dbdff),
  shininess: 18
});

earthMaterial.onBeforeCompile = shader => {
  shader.uniforms.uNightLift = { value: 0.025 };
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <dithering_fragment>',
    `
      // Mantiene una cantidad mínima de información en la zona nocturna
      // sin destruir el contraste del terminador.
      gl_FragColor.rgb = max(gl_FragColor.rgb, outgoingLight * 0.018);
      #include <dithering_fragment>
    `
  );
};

const earth = new THREE.Mesh(sphereGeo, earthMaterial);
planetSpin.add(earth);

/* Luces nocturnas.
   Se calculan con la normal del fragmento y la dirección real del Sol:
   solo aparecen en el hemisferio oscuro. */
const nightUniforms = {
  nightMap: { value: lightsTexture },
  sunDirection: { value: new THREE.Vector3(1, 0.1, 0.5).normalize() },
  intensity: { value: 1.15 }
};

const nightMaterial = new THREE.ShaderMaterial({
  uniforms: nightUniforms,
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldNormal;

    void main() {
      vUv = uv;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D nightMap;
    uniform vec3 sunDirection;
    uniform float intensity;

    varying vec2 vUv;
    varying vec3 vWorldNormal;

    void main() {
      float sunDot = dot(normalize(vWorldNormal), normalize(sunDirection));

      // Suaviza el terminador para reproducir el crepúsculo.
      float night = 1.0 - smoothstep(-0.18, 0.14, sunDot);

      vec3 tex = texture2D(nightMap, vUv).rgb;

      // Extrae principalmente las fuentes luminosas.
      float luma = dot(tex, vec3(0.2126, 0.7152, 0.0722));
      vec3 warm = mix(tex, vec3(1.0, 0.63, 0.28) * luma, 0.34);

      float cityMask = smoothstep(0.025, 0.42, luma);
      vec3 color = warm * night * intensity * (0.22 + cityMask * 1.5);

      gl_FragColor = vec4(color, max(max(color.r, color.g), color.b));
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const nightEarth = new THREE.Mesh(
  new THREE.SphereGeometry(1.0015, 192, 192),
  nightMaterial
);
planetSpin.add(nightEarth);

/* Capa de nubes. */
const cloudMaterial = new THREE.MeshPhongMaterial({
  map: cloudTexture,
  alphaMap: cloudTexture,
  transparent: true,
  opacity: 0.82,
  depthWrite: false,
  side: THREE.FrontSide,
  color: new THREE.Color(0xffffff),
  specular: new THREE.Color(0x334455),
  shininess: 2
});

const clouds = new THREE.Mesh(
  new THREE.SphereGeometry(1.0105, 192, 192),
  cloudMaterial
);
planetSpin.add(clouds);

/* Capa muy tenue bajo las nubes para producir la sensación de sombra. */
const cloudShadowMaterial = new THREE.ShaderMaterial({
  uniforms: {
    cloudMap: { value: cloudTexture },
    sunDirection: nightUniforms.sunDirection
  },
  vertexShader: `
    varying vec2 vUv;
    varying vec3 vWorldNormal;
    void main() {
      vUv = uv;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D cloudMap;
    uniform vec3 sunDirection;
    varying vec2 vUv;
    varying vec3 vWorldNormal;

    void main() {
      vec3 cloud = texture2D(cloudMap, vUv + vec2(0.0016, 0.0)).rgb;
      float density = dot(cloud, vec3(0.3333));
      float daylight = smoothstep(-0.1, 0.45,
        dot(normalize(vWorldNormal), normalize(sunDirection)));
      float alpha = density * daylight * 0.115;
      gl_FragColor = vec4(vec3(0.0), alpha);
    }
  `,
  transparent: true,
  depthWrite: false
});

const cloudShadow = new THREE.Mesh(
  new THREE.SphereGeometry(1.0032, 192, 192),
  cloudShadowMaterial
);
planetSpin.add(cloudShadow);

/* Halo atmosférico exterior. */
const atmosphereUniforms = {
  sunDirection: nightUniforms.sunDirection
};

const atmosphereMaterial = new THREE.ShaderMaterial({
  uniforms: atmosphereUniforms,
  vertexShader: `
    varying vec3 vWorldNormal;
    varying vec3 vWorldPosition;

    void main() {
      vec4 worldPos = modelMatrix * vec4(position, 1.0);
      vWorldPosition = worldPos.xyz;
      vWorldNormal = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    uniform vec3 sunDirection;
    varying vec3 vWorldNormal;
    varying vec3 vWorldPosition;

    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorldPosition);
      float rim = pow(1.0 - max(dot(vWorldNormal, viewDir), 0.0), 3.4);
      float sunAmount = dot(vWorldNormal, normalize(sunDirection));
      float day = smoothstep(-0.42, 0.35, sunAmount);

      vec3 dayBlue = vec3(0.10, 0.48, 1.0);
      vec3 sunset = vec3(1.0, 0.22, 0.045);

      float sunsetBand = exp(-pow((sunAmount + 0.08) * 7.0, 2.0));
      vec3 color = mix(dayBlue * (0.28 + day * 0.72), sunset, sunsetBand * 0.55);

      float alpha = rim * (0.18 + day * 0.72);
      alpha += sunsetBand * rim * 0.16;

      gl_FragColor = vec4(color * alpha * 1.25, alpha);
    }
  `,
  side: THREE.BackSide,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.075, 160, 160),
  atmosphereMaterial
);
earthRoot.add(atmosphere);

/* Halo interior del horizonte para reforzar la dispersión Rayleigh percibida. */
const innerAtmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.012, 160, 160),
  new THREE.ShaderMaterial({
    uniforms: atmosphereUniforms,
    vertexShader: `
      varying vec3 vN;
      varying vec3 vP;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vP = wp.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 sunDirection;
      varying vec3 vN;
      varying vec3 vP;
      void main() {
        vec3 viewDir = normalize(cameraPosition - vP);
        float rim = pow(1.0 - max(dot(vN, viewDir), 0.0), 5.0);
        float sunlight = smoothstep(-0.18, 0.35, dot(vN, normalize(sunDirection)));
        vec3 c = vec3(0.18, 0.62, 1.0);
        float a = rim * sunlight * 0.32;
        gl_FragColor = vec4(c * a, a);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.FrontSide
  })
);
planetSpin.add(innerAtmosphere);

/* Luz solar física direccional. */
const sunLight = new THREE.DirectionalLight(0xffffff, 3.9);
sunLight.position.set(5, 1.1, 3.7);
scene.add(sunLight);

const ambient = new THREE.HemisphereLight(0x9cc7ff, 0x020408, 0.055);
scene.add(ambient);

/* Disco solar fuera de plano para proporcionar una referencia visual. */
const sunSpriteCanvas = document.createElement('canvas');
sunSpriteCanvas.width = sunSpriteCanvas.height = 256;
const sctx = sunSpriteCanvas.getContext('2d');
const grad = sctx.createRadialGradient(128,128,0,128,128,128);
grad.addColorStop(0.0, 'rgba(255,255,255,1)');
grad.addColorStop(0.08, 'rgba(255,246,210,1)');
grad.addColorStop(0.2, 'rgba(255,216,145,.65)');
grad.addColorStop(0.5, 'rgba(255,170,85,.12)');
grad.addColorStop(1.0, 'rgba(255,150,70,0)');
sctx.fillStyle = grad;
sctx.fillRect(0,0,256,256);

const sunTex = new THREE.CanvasTexture(sunSpriteCanvas);
sunTex.colorSpace = THREE.SRGBColorSpace;

const sunSprite = new THREE.Sprite(new THREE.SpriteMaterial({
  map: sunTex,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
sunSprite.scale.set(4.6, 4.6, 1);
scene.add(sunSprite);

/* Campo de estrellas multicapa. */
function makeStars(count, radiusMin, radiusMax, size, opacity) {
  const pos = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  const palette = [
    new THREE.Color(0xb9d7ff),
    new THREE.Color(0xffffff),
    new THREE.Color(0xffe0bb),
    new THREE.Color(0xd8e7ff)
  ];

  for (let i = 0; i < count; i++) {
    const r = THREE.MathUtils.randFloat(radiusMin, radiusMax);
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    const phi = Math.acos(2 * v - 1);

    pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);

    const c = palette[(Math.random() * palette.length) | 0];
    const brightness = THREE.MathUtils.randFloat(0.55, 1.0);
    colors[i*3] = c.r * brightness;
    colors[i*3+1] = c.g * brightness;
    colors[i*3+2] = c.b * brightness;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size,
    sizeAttenuation: true,
    transparent: true,
    opacity,
    vertexColors: true,
    depthWrite: false
  });

  return new THREE.Points(geo, mat);
}

const starsNear = makeStars(4500, 40, 120, 0.09, 0.88);
const starsFar = makeStars(9000, 125, 320, 0.14, 0.62);
scene.add(starsNear, starsFar);

const clock = new THREE.Clock();
let spinSpeed = 1.0;
let autoRotate = true;
let sunAngle = -25;

function updateSun() {
  const a = THREE.MathUtils.degToRad(sunAngle);
  const dir = new THREE.Vector3(
    Math.cos(a) * 5.5,
    0.75,
    Math.sin(a) * 5.5
  );

  sunLight.position.copy(dir);

  const unit = dir.clone().normalize();
  nightUniforms.sunDirection.value.copy(unit);

  sunSprite.position.copy(unit.clone().multiplyScalar(28));
}

updateSun();

/* UI */
const el = id => document.getElementById(id);

el('rotation').addEventListener('input', e => {
  spinSpeed = Number(e.target.value);
  el('rotationValue').textContent = spinSpeed.toFixed(2) + '×';
});

el('sun').addEventListener('input', e => {
  sunAngle = Number(e.target.value);
  el('sunValue').textContent = sunAngle + '°';
  updateSun();
});

el('cloudOpacity').addEventListener('input', e => {
  cloudMaterial.opacity = Number(e.target.value);
  el('cloudValue').textContent = Math.round(cloudMaterial.opacity * 100) + '%';
});

el('autoRotate').addEventListener('change', e => autoRotate = e.target.checked);
el('showClouds').addEventListener('change', e => {
  clouds.visible = e.target.checked;
  cloudShadow.visible = e.target.checked;
});
el('showAtmosphere').addEventListener('change', e => {
  atmosphere.visible = e.target.checked;
  innerAtmosphere.visible = e.target.checked;
});
el('showStars').addEventListener('change', e => {
  starsNear.visible = e.target.checked;
  starsFar.visible = e.target.checked;
});

function animateCameraTo(longitudeDeg, distance = 3.0) {
  // Mantiene el control simple: rotamos el planeta hacia la región.
  const target = THREE.MathUtils.degToRad(longitudeDeg);
  const start = planetSpin.rotation.y;
  const duration = 900;
  const t0 = performance.now();

  function step(now) {
    const t = Math.min(1, (now - t0) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    planetSpin.rotation.y = THREE.MathUtils.lerp(start, target, eased);

    camera.position.lerp(new THREE.Vector3(0, 0.12, distance), 0.08);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

el('viewAmericas').onclick = () => animateCameraTo(-0.7);
el('viewEurope').onclick = () => animateCameraTo(1.15);
el('viewAsia').onclick = () => animateCameraTo(2.65);

renderer.domElement.addEventListener('dblclick', () => {
  camera.position.set(0, 0.15, 3.28);
  controls.target.set(0,0,0);
  controls.update();
});

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);

/* Se oculta el loader después de que el navegador haya tenido tiempo
   de decodificar las texturas embebidas. */
Promise.all([
  dayTexture,
  cloudTexture,
  lightsTexture,
  normalTexture,
  specularTexture
].map(t => new Promise(resolve => {
  if (t.image?.complete) resolve();
  else {
    const check = () => t.image ? resolve() : requestAnimationFrame(check);
    check();
  }
}))).finally(() => {
  setTimeout(() => el('loading').classList.add('hidden'), 350);
});

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (autoRotate) {
    planetSpin.rotation.y += dt * 0.055 * spinSpeed;
  }

  // Movimiento diferencial realista de las nubes.
  clouds.rotation.y += dt * 0.0065;
  cloudShadow.rotation.y = clouds.rotation.y * 0.96;

  // Parallax lentísimo de estrellas.
  starsNear.rotation.y += dt * 0.00018;
  starsFar.rotation.y -= dt * 0.00005;

  controls.update();
  composer.render();
});
</script>
<script type="module" src="./nav.js"></script>
</body>
