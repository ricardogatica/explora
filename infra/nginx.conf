# Explora, servido por prefijo.
#
#   explora.ricardogatica.com/universo/*  →  la app del universo
#   explora.ricardogatica.com/*           →  la app de materias
#
# Las dos compilan a archivos, así que aquí no hay ningún proceso Node: un solo
# nginx con los dos builds dentro. Si algún día materias necesita servidor, ese
# contenedor pasa a ser Node y esta regla no cambia.
#
# El reparto por prefijo solo funciona si la app del universo no pide nada fuera
# de /universo/: sus assets, sus texturas y su favicon cuelgan todos del prefijo
# (ver universo/vite.config.js). Una petición suya a la raíz acabaría en
# materias, que devolvería su propio 404.

include /etc/nginx/conf.d/redirecciones.conf;   # map $uri $destino_heredado

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Detrás de un proxy TLS: las redirecciones se emiten relativas al host que
  # pidió el cliente, no al nombre interno del contenedor.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  # Las texturas son JPG y PNG: ya vienen comprimidas y volver a comprimirlas
  # solo gasta CPU.

  # ── Las URL del sitio anterior ────────────────────────────────────────────
  # 301 y no 302: el cambio es definitivo y así los buscadores trasladan lo que
  # esas páginas hayan acumulado en vez de repartirlo entre dos direcciones.
  if ($destino_heredado) {
    return 301 $destino_heredado;
  }

  # star.html llevaba el slug en la query —un solo archivo para 400 estrellas, que
  # es lo que esta migración vino a arreglar—, así que se traduce aparte.
  location = /sistema_solar/star.html {
    if ($arg_slug) { return 301 /universo/estrellas/$arg_slug; }
    return 301 /universo/indice;
  }

  # Lo que quede bajo /sistema_solar/ y no tenga página nueva: al índice, que es
  # de donde se llega a todo, en vez de a un 404 sin salida.
  location /sistema_solar/ {
    return 301 /universo/indice;
  }

  # ── La API del progreso ───────────────────────────────────────────────────
  # Lo único que no son archivos. Va a otro contenedor, y con `resolver` y una
  # variable para que nginx no se niegue a arrancar si la API todavía no está
  # levantada: el contenido tiene que servirse aunque el progreso no se guarde.
  location /api/ {
    resolver 127.0.0.11 valid=30s;          # el DNS interno de Docker
    set $api "http://api:3100";
    proxy_pass $api$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Guardar una estadística no debe hacer esperar a nadie: si la API tarda,
    # se corta pronto y quien practica ni se entera.
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store";
  }

  # ── El universo ───────────────────────────────────────────────────────────
  # Los assets llevan hash en el nombre: cambiar el contenido cambia la URL, así
  # que se pueden guardar para siempre.
  location /universo/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Texturas y panorámicas (unos 8 MB) no llevan hash: si se corrige una, la URL
  # es la misma. Un mes es caché larga sin condenar a nadie a la versión vieja
  # durante un año.
  location ~ ^/universo/(textures|cielo)/ {
    add_header Cache-Control "public, max-age=2592000";
  }

  location /universo/ {
    # Las 422 páginas están prerenderizadas, cada una en su index.html. Lo que no
    # existe cae en la app, que enseña su propia página de «no existe»; el 404 de
    # error_page se conserva en la respuesta, que es lo que debe leer un buscador.
    #
    # El reserva es spa.html y no la portada: la portada trae su contenido ya
    # pintado, así que se vería el portal un instante antes de que la app
    # reaccione a la URL y lo sustituya por el «no existe».
    error_page 404 /universo/spa.html;
    try_files $uri $uri/index.html =404;
    add_header Cache-Control "no-store";
  }

  # ── Materias, en la raíz ──────────────────────────────────────────────────
  location /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    error_page 404 /404.html;
    try_files $uri $uri/index.html =404;
    # El HTML se regenera en cada despliegue y pesa poco: que no se cachee evita
    # el clásico «a mí me sigue saliendo lo de antes».
    add_header Cache-Control "no-store";
  }
}
